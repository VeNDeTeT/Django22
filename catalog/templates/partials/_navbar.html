<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">
        <a href="{% url 'catalog:home' %}" class="text-dark text-decoration-none">Skystore</a>
    </h5>

    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:catalog' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/blog/">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contact' %}">Контакты</a>
    </nav>


    <div class="ms-3">
        {% if user.is_authenticated %}
            <span class="me-3">👤 {{ user.email }}</span>
            <a class="btn btn-primary" href="{% url 'users:profile' %}">Профиль</a>
            <a class="btn btn-outline-danger" href="{% url 'users:logout' %}">Выход</a>
        {% else %}
            <a class="btn btn-success me-2" href="{% url 'users:register' %}">📝 Регистрация</a>
            <a class="btn btn-primary" href="{% url 'users:login' %}">🔐 Вход</a>
        {% endif %}
    </div>
</div>
