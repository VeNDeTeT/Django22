<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <!-- МЕНЮ ВПРЯМЬУ В base.html -->
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-primary" href="{% url 'catalog:home' %}">Главная</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:catalog' %}">Каталог</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contact' %}">Контакты</a>
        </nav>
    </div>

    <main>{% block content %}{% endblock %}</main>

    <!-- ФУТЕР ВПРЯМЬ В base.html -->
    <footer class="pt-4 my-md-5 pt-md-5 border-top">
        <div class="container">
            <small class="text-muted">&copy; 2026 Skystore</small>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
