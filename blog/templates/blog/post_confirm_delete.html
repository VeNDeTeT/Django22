{% extends 'base.html' %}
{% block title %}Удалить {{ post.title }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1>Удалить статью?</h1>
    <p>Вы уверены, что хотите удалить "<strong>{{ post.title }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
